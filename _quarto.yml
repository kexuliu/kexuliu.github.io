project:
  type: website
  output-dir: _site
  resources:
    - assets/caspian-portrait-transparent-v3.png
    - assets/home-space-v4.jpg
    - robots.txt
    - googleddd6d2c58230dd06.html

website:
  site-url: https://kexuliu.github.io
  title: "Kexu Liu (Caspian)"
  description: "Kexu Liu's research, analysis, and technical notes on artificial intelligence, technology, and markets."
  navbar:
    pinned: true
    collapse-below: lg
    left:
      - text: Research
        href: research/index.qmd
      - text: Analysis
        href: analysis/index.qmd
      - text: Blog
        href: blog/index.qmd
  search:
    location: navbar
    type: overlay
  page-navigation: true
  back-to-top-navigation: true
  open-graph: true
  twitter-card: true
  page-footer:
    left: "© 2026 Kexu Liu"
