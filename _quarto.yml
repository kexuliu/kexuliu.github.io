format:
  html:
    theme: darkly
    css: styles.css
    toc: true
    toc-location: right
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true

execute:
  freeze: auto
